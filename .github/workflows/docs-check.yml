name: docs-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Public content check
        run: bash scripts/check-public-content.sh
      - name: Navigation check
        run: node scripts/check-nav.mjs
      - name: Broken links
        run: npx --yes mint@latest broken-links
